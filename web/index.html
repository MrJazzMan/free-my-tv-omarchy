<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="omarchy.css"><!-- omarchy: the Omarchy look -->
</head>
<body>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <canvas id="bgA" width="48" height="27"></canvas>
    <canvas id="bgB" width="48" height="27"></canvas>
    <div class="wall"></div><!-- omarchy: the Omarchy theme's wallpaper -->
    <div class="veil"></div>
    <div class="lift"></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title"></h1>
      <div id="tabs"></div>
      <div id="cards"></div>
      <div id="clock"><span class="time"></span><span class="date"></span></div>
    </div>
    <div id="platter"></div>
    <div id="tiles"></div>
  </div>
  <div id="drawer" class="layer"></div>
  <!-- omarchy: the top bar (Omarchy themes: a Waybar-like bar; Classic: only the round buttons and the quotes) -->
  <div id="bar">
    <div class="left"><span class="logo">&#xE900;</span><span id="ws"></span><span id="wsname"></span></div>
    <div id="barclock"></div>
    <div class="right"><span id="barwx"></span><span id="barnet"></span></div>
    <div id="quotes"></div>
    <div id="buttons"></div>
  </div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="gallery" class="layer"></div><!-- omarchy: wallpaper gallery -->
  <div id="themes" class="layer"><div class="box"></div></div><!-- omarchy: theme picker -->
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="coins.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="themes.js"></script><!-- omarchy: the Omarchy themes -->
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
